[workspace]
members = [
    "crates/im-core",
    "crates/im-core-dart",
    "crates/awiki-cli",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.78"
license = "MIT"
repository = "git@github.com:AgentConnect/awiki-cli-rs2.git"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
anp = { path = "../anp/anp/rust", default-features = false }
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
time = { version = "=0.3.36", features = ["formatting", "parsing"] }
