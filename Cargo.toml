[workspace]
members = [
    "crates/user-dirs",
    "crates/im-core",
    "crates/im-core-node",
    "crates/im-core-dart",
    "crates/awiki-cli",
    "crates/awiki-deamon",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88.0"
license = "AGPL-3.0-only"
repository = "git@github.com:AgentConnect/awiki-cli-rs2.git"

[workspace.dependencies]
awiki-user-dirs = { path = "crates/user-dirs" }
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bs58 = "0.5"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
ed25519-dalek = { version = "=2.1.1", features = ["rand_core", "pkcs8", "pem"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
hmac = "0.12"
idna = "1.1"
libc = "0.2"
napi = { version = "=3.12.1", default-features = false, features = ["napi8", "async", "serde-json", "dyn-symbols"] }
napi-derive = "=3.6.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3.2"
semver = "1"
sha2 = "0.10"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
fs2 = "0.4"
anp = { version = "1.0.0", path = "../anp/anp/rust", default-features = false }
anp-identity = { path = "../anp/anp-identity/crates/anp-identity", features = ["key-import", "root-export"] }
rand = "0.8"
redb = "=2.6.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
webpki-roots = "0.26"
futures-util = "0.3"
time = { version = "=0.3.36", features = ["formatting", "parsing"] }
uuid = "1"
