[workspace]
members = [
    "crates/im-core",
    "crates/im-core-dart",
    "crates/awiki-cli",
    "crates/awiki-deamon",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88.0"
license = "MIT"
repository = "git@github.com:AgentConnect/awiki-cli-rs2.git"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
anp = { path = "../anp/anp/rust", default-features = false }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
webpki-roots = "0.26"
futures-util = "0.3"
time = { version = "=0.3.36", features = ["formatting", "parsing"] }
