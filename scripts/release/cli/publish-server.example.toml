# Copy this file to publish-server.toml in the same directory and chmod 0600.
public_origin = "https://example.com"
public_base_path = "/cli"
default_backend_base_url = "https://example.com"
default_did_host = "example.com"
web_root = "/var/www/awiki-web/cli"
archive_root = "/var/lib/awiki-cli"
# Existing production versioned downloads: use their current versioned installer directory, preserving old releases.
installer_root = "/var/lib/awiki-cli/installers/stable"
# Optional: retain an existing shared store for old versioned platform archive URLs.
# stable_artifact_root = "/var/lib/awiki-cli/artifacts"
nginx_config = "/etc/nginx/conf.d/example.com.conf"
nginx_http_snippet = "/etc/nginx/conf.d/00-awiki-cli-download-zones.conf"
nginx_snippet = "/etc/nginx/snippets/awiki-cli-release.conf"
nginx_backup_root = "/var/backups/awiki-nginx"
github_repo = "AgentConnect/awiki-cli-rs2"
github_workflow = "build-cli-release.yml"
github_token = "replace-me"
cli_download_max_per_ip = "2"
cli_download_max_total = "4"
cli_download_rate_after = "1m"
cli_download_rate = "512k"
document_tenants = "/etc/awiki/cli-document-tenants.json"
