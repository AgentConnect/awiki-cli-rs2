# Copy this file to publish-server.toml in the same directory and chmod 0600.
public_origin = "https://example.com"
public_base_path = "/cli"
default_backend_base_url = "https://example.com"
default_did_host = "example.com"
web_root = "/var/www/awiki-web/cli"
archive_root = "/var/lib/awiki-cli"
nginx_config = "/etc/nginx/conf.d/example.com.conf"
nginx_snippet = "/etc/nginx/snippets/awiki-cli-release.conf"
protocol_gateway_checkout = "/home/ecs-user/protocol-gateway"
protocol_gateway_origin = "http://127.0.0.1:9896"
protocol_gateway_service = "protocol-gateway"
github_repo = "AgentConnect/awiki-cli-rs2"
github_workflow = "build-cli-release.yml"
github_token = "replace-me"
