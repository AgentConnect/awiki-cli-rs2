[package]
name = "awiki-im-core"
version = "0.1.0"
description = "Rust IM SDK for Awiki clients built on Agent Network Protocol (ANP)"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/AgentConnect/awiki-cli-rs2"
documentation = "https://docs.rs/awiki-im-core"
keywords = ["awiki", "im", "anp", "did", "messaging"]
categories = ["api-bindings", "authentication", "network-programming"]

[features]
default = ["sqlite", "http"]
blocking = []
sqlite = ["dep:fs2", "dep:rusqlite"]
http = []
internal-test-helpers = []
mcp-trusted-registration = []

# Reserved for later phases.
email = []
attachments = []
realtime = []
secure-direct = []
group-e2ee = ["sqlite", "anp/mls"]
provider-traits = []

[dependencies]
anp.workspace = true
base64.workspace = true
bs58.workspace = true
chacha20poly1305.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
hkdf.workspace = true
idna.workspace = true
rand.workspace = true
reqwest.workspace = true
futures-util.workspace = true
redb.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zeroize.workspace = true
time.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
rusqlite = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "=3.3.0"
