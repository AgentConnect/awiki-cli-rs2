[package]
name = "awiki-deamon"
version = "0.1.100"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "awiki-deamon"
path = "src/main.rs"

[features]
default = []
system-test-probe = []

[dependencies]
agent-client-protocol = "=2.1.0"
anp.workspace = true
anp-identity.workspace = true
anyhow.workspace = true
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
awiki-user-dirs.workspace = true
base64.workspace = true
bs58.workspace = true
chacha20poly1305.workspace = true
futures-util.workspace = true
hkdf.workspace = true
im-core = { package = "awiki-im-core", version = "=0.1.5", path = "../im-core", features = ["blocking"] }
libc.workspace = true
rand.workspace = true
regex = "1.11"
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
semver.workspace = true
sha2.workspace = true
tempfile = "=3.3.0"
time.workspace = true
tokio = { workspace = true, features = ["process"] }
x25519-dalek.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Storage_FileSystem"] }
