name: Singapore static previews
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  previews:
    if: github.ref == 'refs/heads/test/singapore-release-20261012'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: AgentConnect/awiki-web
          ref: 311ca5645a96016cc4fc0fb936268a0a89ef853e
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build AWiki Me preview
        working-directory: awiki-me
        run: |
          npm ci
          npm run build -- --base=/downloads/singapore-release-20261012/previews/awiki-me/
      - name: Stage static previews
        run: |
          mkdir -p preview/awiki-me
          cp -R awiki-me/dist/. preview/awiki-me/
          cp -R awiki-ai preview/awiki-ai
          cp -R dsh-desktop preview/dsh-desktop
          python3 - <<'PY'
          import pathlib,json
          prefix='/downloads/singapore-release-20261012/previews/'
          for site in ['awiki-ai','dsh-desktop']:
              for p in (pathlib.Path('preview')/site).rglob('*.html'):
                  s=p.read_text()
                  for old,new in [('/desktop/assets/',prefix+'dsh-desktop/assets/'),('/assets/',prefix+site+'/assets/'),('/desktop/zh/',prefix+'dsh-desktop/zh/')]:
                      s=s.replace('"'+old,'"'+new).replace("'"+old,"'"+new)
                  p.write_text(s)
          pathlib.Path('preview/provenance.json').write_text(json.dumps({'source':'311ca5645a96016cc4fc0fb936268a0a89ef853e','defaultDownloadsChanged':False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: singapore-static-previews
          path: preview
          if-no-files-found: error
          retention-days: 30
