name: Windows Client x64 Integration
run-name: Windows client x64 from Core ${{ github.sha }}

on:
  push:
    branches: [feature/windows-client]

permissions:
  contents: read

concurrency:
  group: windows-client-x64-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.0
  RUST_VERSION: 1.88.0
  WINDOWS_TARGET: x86_64-pc-windows-msvc
  ANP_REF: 67e6680fac80a5fb3dca41029c67a0ea3ecc0dd5
  PRIMARY_TENANT_DOMAIN: awiki.ai
  PUB_HOSTED_URL: https://pub.dev
  FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com

jobs:
  validate-package:
    name: Build, smoke, and package
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout exact CLI / IM Core source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: awiki-cli-rs2
          persist-credentials: false

      - name: Resolve immutable source refs
        id: sources
        shell: pwsh
        env:
          EXPECTED_CORE_REF: ${{ github.sha }}
        run: |
          $appRefPath = Join-Path $env:GITHUB_WORKSPACE 'awiki-cli-rs2\.github\windows-client-awiki-me.sha'
          $appRef = (Get-Content -LiteralPath $appRefPath -Raw).Trim()
          if ($appRef -cnotmatch '^[0-9a-f]{40}$') {
            throw '.github/windows-client-awiki-me.sha must contain exactly one lowercase 40-character APP SHA'
          }
          if ($appRef -eq ('0' * 40)) {
            throw '.github/windows-client-awiki-me.sha is still the all-zero placeholder; replace it with the committed AWiki Me feature SHA'
          }

          $coreRef = (& git -C awiki-cli-rs2 rev-parse 'HEAD^{commit}').Trim()
          if ($LASTEXITCODE -ne 0 -or $coreRef -cne $env:EXPECTED_CORE_REF) {
            throw "Core checkout is $coreRef, expected $env:EXPECTED_CORE_REF"
          }
          if ($env:ANP_REF -cnotmatch '^[0-9a-f]{40}$') {
            throw 'ANP_REF must be a lowercase 40-character SHA'
          }

          "app_ref=$appRef" >> $env:GITHUB_OUTPUT
          "core_ref=$coreRef" >> $env:GITHUB_OUTPUT
          "anp_ref=$env:ANP_REF" >> $env:GITHUB_OUTPUT

      - name: Checkout exact AWiki Me source
        uses: actions/checkout@v6
        with:
          repository: AgentConnect/awiki-me
          ref: ${{ steps.sources.outputs.app_ref }}
          path: awiki-me
          persist-credentials: false

      - name: Checkout exact ANP source
        uses: actions/checkout@v6
        with:
          repository: agent-network-protocol/anp
          ref: ${{ steps.sources.outputs.anp_ref }}
          path: anp/anp
          persist-credentials: false

      - name: Verify exact source checkouts
        shell: pwsh
        env:
          APP_REF: ${{ steps.sources.outputs.app_ref }}
          CORE_REF: ${{ steps.sources.outputs.core_ref }}
          EXPECTED_ANP_REF: ${{ steps.sources.outputs.anp_ref }}
        run: |
          $sources = @(
            @{ Name = 'APP'; Path = 'awiki-me'; Expected = $env:APP_REF },
            @{ Name = 'Core'; Path = 'awiki-cli-rs2'; Expected = $env:CORE_REF },
            @{ Name = 'ANP'; Path = 'anp/anp'; Expected = $env:EXPECTED_ANP_REF }
          )
          foreach ($source in $sources) {
            $actual = (& git -C $source.Path rev-parse 'HEAD^{commit}').Trim()
            if ($LASTEXITCODE -ne 0 -or $actual -cne $source.Expected) {
              throw "$($source.Name) checkout is $actual, expected $($source.Expected)"
            }
          }

          $releaseConfig = Get-Content -LiteralPath 'awiki-cli-rs2/scripts/release/cli/release-config.json' -Raw | ConvertFrom-Json
          if ($releaseConfig.anp_commit -cne $env:EXPECTED_ANP_REF) {
            throw "Core release config pins $($releaseConfig.anp_commit), expected $env:EXPECTED_ANP_REF"
          }

      - name: Read committed APP version
        id: app-version
        shell: pwsh
        run: |
          $pubspec = Get-Content -LiteralPath 'awiki-me/pubspec.yaml' -Raw
          $match = [regex]::Match(
            $pubspec,
            '(?m)^version:\s*(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)\+([1-9]\d*)\s*$'
          )
          if (-not $match.Success) {
            throw 'awiki-me/pubspec.yaml must contain a semantic version and positive build number'
          }
          "version=$($match.Groups[1].Value)" >> $env:GITHUB_OUTPUT
          "build_number=$($match.Groups[2].Value)" >> $env:GITHUB_OUTPUT

      - name: Setup Flutter 3.44.0
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ env.WINDOWS_TARGET }}

      - name: Restore Rust build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            awiki-cli-rs2/target
          key: windows-client-x64-${{ runner.os }}-${{ hashFiles('awiki-cli-rs2/Cargo.lock') }}

      - name: Verify pinned toolchains
        shell: pwsh
        run: |
          $flutterOutput = @(& flutter --version)
          $flutterVersionLine = $flutterOutput | Where-Object { $_ -match '^Flutter\s+\S+' } | Select-Object -Last 1
          $flutterVersion = if ($flutterVersionLine -match '^Flutter\s+(\S+)') { $Matches[1] } else { '' }
          if ($LASTEXITCODE -ne 0 -or $flutterVersion -ne $env:FLUTTER_VERSION) {
            throw "Flutter must be $env:FLUTTER_VERSION, got $flutterVersion"
          }
          $rust = ((& rustc "+$env:RUST_VERSION" --version) -split '\s+')[1]
          if ($LASTEXITCODE -ne 0 -or $rust -ne $env:RUST_VERSION) {
            throw "Rust must be $env:RUST_VERSION, got $rust"
          }
          & flutter config --enable-windows-desktop
          if ($LASTEXITCODE -ne 0) { throw 'Failed to enable Flutter Windows desktop' }

      - name: Install pinned Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.3.2 --allow-downgrade --no-progress --yes

      - name: Compile Inno installer script
        working-directory: awiki-me
        shell: pwsh
        run: |
          $sourceDir = Join-Path $env:RUNNER_TEMP 'awiki-inno-contract-source'
          $outputDir = Join-Path $env:RUNNER_TEMP 'awiki-inno-contract-output'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $sourceDir, $outputDir
          New-Item -ItemType Directory -Force -Path $sourceDir, $outputDir | Out-Null
          Set-Content `
            -LiteralPath (Join-Path $sourceDir 'runtime-placeholder.txt') `
            -Value 'installer syntax fixture' `
            -Encoding utf8

          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "Inno Setup compiler was not found: $compiler"
          }
          & $compiler `
            "/DMyAppSourceDir=$sourceDir" `
            "/DMySetupIcon=$(Join-Path $PWD 'windows\runner\resources\app_icon.ico')" `
            '/DMyAppVersion=0.0.0' `
            '/DMyVersionInfoVersion=0.0.0.1' `
            '/DMyBuildNumber=1' `
            "/DMyOutputDir=$outputDir" `
            '/DMyOutputBaseFilename=AWiki-Me-inno-contract' `
            (Join-Path $PWD 'installer\windows\awiki-me.iss')
          if ($LASTEXITCODE -ne 0) {
            throw "Inno installer contract compilation failed with exit code $LASTEXITCODE"
          }
          $installer = Join-Path $outputDir 'AWiki-Me-inno-contract.exe'
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Inno installer contract output is missing: $installer"
          }

      - name: Run IM Core Rust Windows tests
        working-directory: awiki-cli-rs2
        shell: pwsh
        run: |
          & cargo "+$env:RUST_VERSION" test `
            -p im-core-dart `
            --locked `
            --no-default-features `
            --features blocking,sqlite,http,windows

      - name: Build and verify x64 native IM Core
        working-directory: awiki-cli-rs2
        shell: pwsh
        run: ./scripts/flutter/build-windows.ps1

      - name: Run IM Core Flutter loader tests
        working-directory: awiki-cli-rs2/packages/awiki_im_core
        shell: pwsh
        run: |
          flutter pub get
          flutter test --no-pub test/native_library_loader_test.dart

      - name: Install AWiki Me dependencies
        working-directory: awiki-me
        shell: pwsh
        run: flutter pub get

      - name: Run Windows runner and packaging contract tests
        working-directory: awiki-me
        shell: pwsh
        run: |
          flutter test `
            --no-pub `
            --concurrency=1 `
            tests/unit/windows_runner_configuration_test.dart `
            tests/unit/windows_installer_configuration_test.dart `
            tests/unit/package_manifest_test.dart `
            tests/unit/windows_scope_secret_integration_configuration_test.dart

      - name: Build Windows Debug
        working-directory: awiki-me
        shell: pwsh
        env:
          APP_REF: ${{ steps.sources.outputs.app_ref }}
          CORE_REF: ${{ steps.sources.outputs.core_ref }}
          APP_VERSION: ${{ steps.app-version.outputs.version }}
          APP_BUILD_NUMBER: ${{ steps.app-version.outputs.build_number }}
        run: |
          flutter build windows `
            --debug `
            --no-pub `
            "--dart-define=AWIKI_PRIMARY_TENANT_DOMAIN=$env:PRIMARY_TENANT_DOMAIN" `
            "--dart-define=AWIKI_APP_SOURCE_REF=$env:APP_REF" `
            "--dart-define=AWIKI_IM_CORE_SOURCE_REF=$env:CORE_REF" `
            --build-name $env:APP_VERSION `
            --build-number $env:APP_BUILD_NUMBER

      - name: Build Windows Release
        working-directory: awiki-me
        shell: pwsh
        env:
          APP_REF: ${{ steps.sources.outputs.app_ref }}
          CORE_REF: ${{ steps.sources.outputs.core_ref }}
          APP_VERSION: ${{ steps.app-version.outputs.version }}
          APP_BUILD_NUMBER: ${{ steps.app-version.outputs.build_number }}
        run: |
          flutter build windows `
            --release `
            --no-pub `
            "--dart-define=AWIKI_PRIMARY_TENANT_DOMAIN=$env:PRIMARY_TENANT_DOMAIN" `
            "--dart-define=AWIKI_APP_SOURCE_REF=$env:APP_REF" `
            "--dart-define=AWIKI_IM_CORE_SOURCE_REF=$env:CORE_REF" `
            --build-name $env:APP_VERSION `
            --build-number $env:APP_BUILD_NUMBER

      - name: Run real IM Core SQLite and identity Vault smoke
        working-directory: awiki-me
        shell: pwsh
        run: |
          flutter test `
            --no-pub `
            --dart-define=AWIKI_E2E=true `
            integration_test/im_core_open_smoke_test.dart `
            -d windows

      - name: Run app, single-instance, shutdown, and Credential smoke
        working-directory: awiki-me
        shell: pwsh
        run: |
          ./scripts/windows/run_pr_smoke.ps1 `
            -ReleaseDir build/windows/x64/runner/Release

      - name: Build production scope-secret MethodChannel probe
        working-directory: awiki-me
        shell: pwsh
        env:
          APP_REF: ${{ steps.sources.outputs.app_ref }}
          CORE_REF: ${{ steps.sources.outputs.core_ref }}
        run: |
          flutter build windows `
            --release `
            --no-pub `
            --target tests/e2e/flutter/native/production_scope_restart_probe.dart `
            "--dart-define=AWIKI_APP_SOURCE_REF=$env:APP_REF" `
            "--dart-define=AWIKI_IM_CORE_SOURCE_REF=$env:CORE_REF"

      - name: Verify production Credential Manager lifecycle
        working-directory: awiki-me
        shell: pwsh
        run: |
          ./scripts/windows/run_scope_secret_integration.ps1 `
            -ReleaseDir build/windows/x64/runner/Release

      - name: Build and verify unsigned Inno installer
        working-directory: awiki-me
        shell: pwsh
        env:
          APP_REF: ${{ steps.sources.outputs.app_ref }}
          CORE_REF: ${{ steps.sources.outputs.core_ref }}
          EXPECTED_ANP_REF: ${{ steps.sources.outputs.anp_ref }}
          APP_VERSION: ${{ steps.app-version.outputs.version }}
          APP_BUILD_NUMBER: ${{ steps.app-version.outputs.build_number }}
        run: |
          ./scripts/package_windows.ps1 `
            -Target windows-x64 `
            -Version $env:APP_VERSION `
            -BuildNumber $env:APP_BUILD_NUMBER `
            -AppRef $env:APP_REF `
            -CoreRef $env:CORE_REF `
            -AnpRef $env:EXPECTED_ANP_REF `
            -PrimaryTenantDomain $env:PRIMARY_TENANT_DOMAIN `
            -CoreDir ../awiki-cli-rs2 `
            -AnpDir ../anp/anp `
            -OutputDir ../package-output/windows-x64

      - name: Generate and verify Windows package manifest
        working-directory: awiki-me
        shell: pwsh
        env:
          APP_REF: ${{ steps.sources.outputs.app_ref }}
          CORE_REF: ${{ steps.sources.outputs.core_ref }}
          EXPECTED_ANP_REF: ${{ steps.sources.outputs.anp_ref }}
          APP_VERSION: ${{ steps.app-version.outputs.version }}
          APP_BUILD_NUMBER: ${{ steps.app-version.outputs.build_number }}
        run: |
          dart run tool/package_manifest.dart aggregate `
            --targets windows-x64 `
            --artifacts-root ../package-output `
            --output-dir ../package-aggregate `
            --version $env:APP_VERSION `
            --build-number $env:APP_BUILD_NUMBER `
            --app-ref $env:APP_REF `
            --core-ref $env:CORE_REF `
            --anp-ref $env:EXPECTED_ANP_REF `
            --download-base-url 'https://awiki.ai/downloads/awiki-me' `
            --download-page-url 'https://awiki.ai/#download'
          if ($LASTEXITCODE -ne 0) { throw 'Package manifest aggregation failed' }

          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'package-aggregate\package-manifest.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $artifact = $manifest.artifacts.'windows-x64'
          $expectedFilename = "AWiki-Me-$env:APP_VERSION-windows-x64.exe"
          if ($artifact.filename -cne $expectedFilename -or
              $artifact.signingState -cne 'unsigned' -or
              $manifest.sourceRefs.app -cne $env:APP_REF -or
              $manifest.sourceRefs.imCore -cne $env:CORE_REF -or
              $manifest.sourceRefs.anp -cne $env:EXPECTED_ANP_REF) {
            throw 'Aggregated Windows package manifest does not match the immutable build inputs'
          }

      - name: Upload unsigned Windows installer and manifests
        uses: actions/upload-artifact@v7
        with:
          name: awiki-me-windows-x64-${{ steps.sources.outputs.app_ref }}-${{ steps.sources.outputs.core_ref }}
          path: package-aggregate/
          if-no-files-found: error
          retention-days: 14
