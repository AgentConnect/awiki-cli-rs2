name: Dependency modes
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: node --test scripts/release/node-sdk/source-evidence.test.mjs
      - run: python3 -m unittest discover -s scripts/dependencies -p 'test_*.py' -v
      - run: python3 -m unittest discover -s scripts/release -p 'test_registry_build.py' -v
      - run: python3 -m unittest discover -s scripts/flutter -p 'test_source_artifact.py' -v
      - name: Check selected development dependency graph
        env:
          SOURCE_PR: ${{ (github.head_ref || github.ref_name) == 'Feature/registration-account-first' && '1' || '0' }}
        run: |
          if [[ "$SOURCE_PR" == "1" ]]; then
            python3 scripts/dependencies/build.py --deps source --source-manifest dependencies.source.json --check --package awiki-cli
          else
            python3 scripts/dependencies/build.py --check --package awiki-cli
          fi
  source-integration-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - if: hashFiles('dependencies.source.json') != ''
        run: python3 scripts/dependencies/build.py --deps source --source-manifest dependencies.source.json --check --package awiki-cli
      - if: hashFiles('dependencies.source.json') != ''
        run: python3 scripts/dependencies/build.py --deps source --source-manifest dependencies.source.json --check --package im-core-dart
