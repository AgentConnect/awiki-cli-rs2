name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os_name }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: linux
            arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - os_name: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
          - os_name: darwin
            arch: amd64
            target: x86_64-apple-darwin
            runner: macos-13
          - os_name: darwin
            arch: arm64
            target: aarch64-apple-darwin
            runner: macos-latest
          - os_name: windows
            arch: amd64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
          - os_name: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: awiki-cli-rs2

      - name: Checkout ANP Rust SDK
        uses: actions/checkout@v4
        with:
          repository: agent-network-protocol/anp
          path: anp

      - name: Set up Rust
        shell: bash
        working-directory: awiki-cli-rs2
        run: |
          rustup toolchain install 1.79.0 --profile minimal
          rustup target add --toolchain 1.79.0 ${{ matrix.target }}

      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release archive
        shell: bash
        working-directory: awiki-cli-rs2
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/release/build-release-artifact.sh \
            --version "${version}" \
            --os "${{ matrix.os_name }}" \
            --arch "${{ matrix.arch }}" \
            --target "${{ matrix.target }}"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: awiki-cli-${{ matrix.os_name }}-${{ matrix.arch }}
          path: awiki-cli-rs2/dist/awiki-cli-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: awiki-cli-rs2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
          scope: '@awiki'

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          (cd dist && sha256sum awiki-cli-* > "awiki-cli-${version}-checksums.txt")

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*

      - name: Publish to npm (stable tags only)
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
        working-directory: awiki-cli-rs2
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "Publishing @awiki/cli to npm for ${GITHUB_REF}..."
          npm publish --access public
