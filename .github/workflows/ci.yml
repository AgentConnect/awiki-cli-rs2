name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'
      - 'feature/**'

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: awiki-cli-rs2

      - name: Checkout ANP Rust SDK
        uses: actions/checkout@v4
        with:
          repository: agent-network-protocol/anp
          path: anp

      - name: Set up Rust
        working-directory: awiki-cli-rs2
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Check formatting
        working-directory: awiki-cli-rs2
        run: cargo +1.88.0 fmt --check

      - name: Run unit tests
        working-directory: awiki-cli-rs2
        run: scripts/test-unit.sh

      - name: Run cargo check
        working-directory: awiki-cli-rs2
        run: cargo +1.88.0 check -p awiki-cli --locked

      - name: Check structure
        working-directory: awiki-cli-rs2
        run: cargo +1.88.0 run --bin xtask --locked -- check-structure

      - name: Check release script syntax
        working-directory: awiki-cli-rs2
        run: |
          for f in scripts/test-unit.sh scripts/test-unit-cover.sh scripts/release/*.sh; do
            bash -n "$f"
          done
          python3 -m py_compile scripts/check_rust_coverage.py scripts/hermes_notify_adapter.py scripts/host_notify_webhook_server.py
          python3 -m unittest discover -s scripts -p 'test_hermes_notify_adapter.py'

      - name: Check release artifact plan
        working-directory: awiki-cli-rs2
        run: scripts/release/build-release-artifact.sh --dry-run

      - name: Run installer script tests
        working-directory: awiki-cli-rs2
        run: |
          node -e "const m = require('./scripts/install.js')._internal; if (m.getDownloadUrl('1.2.3','linux','amd64').fileName !== 'awiki-cli-1.2.3-linux-amd64.tar.gz') process.exit(1)"
          node -e "const m = require('./scripts/run.js')._internal; if (!m.findBinary().includes('bin')) process.exit(1)"
