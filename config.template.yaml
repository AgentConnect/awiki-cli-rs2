schema_version: 1
identity:
  active: ""
runtime:
  mode: websocket
  socket_path: ""
  listener:
    enabled: true
    auto_install: true
    auto_start: true
  host_notify:
    enabled: true
    sink: log
    file_path: ""
    openclaw:
      hook_url: ""
      token: ""
    hermes:
      notify_url: http://127.0.0.1:8765/notify/host-event
      secret: ""
output:
  format: json
  no_color: false
services:
  # Backend base URL and DID host are tenant registry values. Create or switch tenants with:
  # awiki-cli tenant create <name> --backend-base-url <url> --did-host <host>
  # awiki-cli tenant use <name>
  # Set these only when the DID document should advertise a custom public ANP service.
  anp_service_endpoint: ""
  anp_service_did: ""
  ca_bundle: ""
  # Empty means reuse the active tenant backend base URL.
  mail_service_url: ""
