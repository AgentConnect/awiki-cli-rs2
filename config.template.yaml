schema_version: 1
identity:
  active: ""
runtime:
  mode: websocket
  socket_path: ""
  listener:
    enabled: true
    auto_install: true
    auto_start: true
  host_notify:
    enabled: true
    sink: log
    file_path: ""
    openclaw:
      hook_url: ""
      token: ""
    hermes:
      notify_url: http://127.0.0.1:8765/notify/host-event
      secret: ""
output:
  format: json
  no_color: false
services:
  # Platform service URL used for User-Service and Message-Service APIs.
  service_base_url: https://awiki.ai
  # DID provider domain. Tenant identities may set this to a.com while keeping service_base_url on awiki.ai.
  # Bare handles entered in id/msg/group commands are completed against this domain before lookup/register/recover.
  # Explicit full handles like alice.example.com keep their own domain for that command.
  did_domain: awiki.ai
  # Defaults derive from service_base_url, not did_domain; set explicitly when advertising a custom ANP service.
  anp_service_endpoint: https://awiki.ai/anp-im/rpc
  anp_service_did: did:wba:awiki.ai
  ca_bundle: ""
  mail_service_url: https://mail.awiki.ai
