name: awiki_im_core
description: Awiki IM core Flutter SDK backed by Rust im-core.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  flutter_rust_bridge: 2.12.0
  meta: ^1.12.0
  path: ^1.9.0
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.26.0
  flutter_lints: ^4.0.0
  freezed: ^3.2.5
  build_runner: ^2.15.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
